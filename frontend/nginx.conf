server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 上传 Excel 允许 20MB（后端限制 10MB，留余量；默认 1M 会导致 413）
    client_max_body_size 70M;

    # 安全响应头 + 隐藏版本号
    server_tokens off;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # 开启 gzip 压缩：JS/CSS 传输体积降约 70%，显著加快首屏与登录速度
    gzip on;
    gzip_vary on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/javascript image/svg+xml application/xml;

    # SPA 入口不缓存，避免用户吃到旧版前端 JS（Vite 产物带 hash，assets 可长缓存）
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA 路由 fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 反向代理后端 API
    # 大文件导入（数万行 xlsx 解析+入库）耗时数分钟，nginx 默认 60s 超时会返回 502。
    # 这里放宽到 600s 与前端 axios timeout 对齐；buffering off 让请求体流式转发。
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 300s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
